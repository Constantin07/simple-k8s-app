suite: Test service canary

templates:
  - templates/service-canary.yaml

release:
  name: test-release

set:
  rollouts.enabled: true
  rollouts.strategy: canary

tests:
  - it: should pass
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - contains:
          path: spec.ports
          content:
            port: 8080
            targetPort: 8080
            protocol: TCP
      - matchRegex:
          path: spec.selector["app.kubernetes.io/name"]
          pattern: hello-kubernetes

  - it: should contain document
    release:
      name: test-release
    asserts:
      - containsDocument:
          kind: Service
          apiVersion: v1
        documentIndex: 0
