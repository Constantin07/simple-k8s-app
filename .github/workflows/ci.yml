name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened] # Don't trigger on PR close/merge
    paths:
      - 'pipelines/kubernetes/hello-kubernetes/deploy/dockerfile/**'
      - 'pipelines/kubernetes/hello-kubernetes/deploy/**'
      - .github/workflows/ci.yml
      - .github/workflows/determine-version.yml
    branches:
      - master

  push:
    paths:
      - 'pipelines/kubernetes/hello-kubernetes/deploy/dockerfile/**'
      - 'pipelines/kubernetes/hello-kubernetes/deploy/**'
      - .github/workflows/ci.yml
      - .github/workflows/determine-version.yml
    branches:
      - master

permissions: read-all

concurrency: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  determine-version:
    uses: ./.github/workflows/determine-version.yml
    with:
      targetPath: pipelines/kubernetes/hello-kubernetes/deploy/

  run-unit-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pipelines/kubernetes/hello-kubernetes/deploy/dockerfile
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install NodeS
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'       # Automatically caches npm dependencies
          cache-dependency-path: pipelines/kubernetes/hello-kubernetes/deploy/dockerfile

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: APP_VERSION=1.1.1 npm run test

  build:
    needs: [determine-version, run-unit-test]
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: write  # Allow to push tags
    defaults:
      run:
        working-directory: pipelines/kubernetes/hello-kubernetes/deploy/dockerfile
    env:
      IMAGE_REPOSITORY: 'constantin07/hello-kubernetes'
      PLATFORMS: 'linux/amd64,linux/arm64'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Check if tag already exists
        id: check
        run: |
          NEXT_VERSION="${{ needs.determine-version.outputs.next_version }}"
          echo "NEXT_VERSION=$NEXT_VERSION" >> "$GITHUB_ENV"

          TAG_EXISTS=$(git ls-remote --tags origin "refs/tags/$NEXT_VERSION" | wc -l)
          echo "exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
          if [[ $TAG_EXISTS -gt 0 ]]; then
            echo "❌ Tag $NEXT_VERSION already exists. Failing."
            exit 1
          else
            echo "✅ Tag $NEXT_VERSION does not exist. Proceeding."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REPOSITORY }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          ecr: false

      - name: Debug version
        run: |
          echo "NEXT_VERSION=${NEXT_VERSION}"
          echo "IMAGE_REPOSITORY=${IMAGE_REPOSITORY}"

      - name: Docker build
        uses: docker/build-push-action@v7
        with:
          context: pipelines/kubernetes/hello-kubernetes/deploy/dockerfile
          platforms: "${{ env.PLATFORMS }}"
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ env.NEXT_VERSION }}
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ env.NEXT_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          load: false

      - name: Buildx load (for Trivy scan)
        run: docker buildx build --load -t ${{ env.IMAGE_REPOSITORY }}:${{ env.NEXT_VERSION }} .

      - name: Run trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}:${{ env.NEXT_VERSION }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Docker push
        run: |
          docker buildx build \
            --platform "${{ env.PLATFORMS }}" \
            --build-arg APP_VERSION="${NEXT_VERSION}" \
            --push -t ${{ env.IMAGE_REPOSITORY }}:${{ env.NEXT_VERSION }} .

      - name: Verify APP_VERSION
        run: |
          docker inspect "${IMAGE_REPOSITORY}:${NEXT_VERSION}" \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep APP_VERSION

  helm-package-push:
    needs: [build, determine-version]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # important for GHCR
    defaults:
      run:
        working-directory: pipelines/kubernetes/hello-kubernetes/deploy
    env:
      HELM_VERSION: 4.2.4
      CHART_REPOSITORY: 'constantin07/hello-kubernetes-helm'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install helm binary
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Run helm lint
        run: helm lint ./hello-kubernetes -f values.yaml

      - name: Cache helm plugins
        id: helm-plugin-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/helm/plugins
          key: ${{ runner.os }}-helm-${{ env.HELM_VERSION }}-plugins-unittest

      - name: Install helm unittest plugin
        if: steps.helm-plugin-cache.outputs.cache-hit != 'true'
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --verify=false

      - name: Run helm unittest
        run: |
          set -euo pipefail
          helm unittest ./hello-kubernetes | tee test-output.txt

      - name: Publish unittest results to job summary
        if: always()
        run: |
          echo "## Helm Unit Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat test-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Package Helm chart
        env:
          VERSION: "${{ needs.determine-version.outputs.next_version }}"
        run: |
          yq -i '.image.tag = strenv(VERSION)' ./hello-kubernetes/values.yaml
          helm package ./hello-kubernetes --version "$VERSION" --app-version "$VERSION"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} --password-stdin

      - name: Push Helm chart to OCI registry
        run: |
          CHART_FILE="$(ls *.tgz)"
          helm push "$CHART_FILE" "oci://ghcr.io/${CHART_REPOSITORY}"

  release:
    needs: [determine-version, build, helm-package-push]
    if: ${{ github.ref_name == 'master' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0    # Fetch full history
          fetch-tags: true  # Fetch tags too

      - name: Get version
        env:
          VERSION: "${{ needs.determine-version.outputs.next_version }}"
        run: |
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "$VERSION"

      - name: Set up git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push tag
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --current --tag "$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --title="Release $VERSION" \
            --repo="$GITHUB_REPOSITORY" \
            --notes-file=CHANGELOG.md \
            --latest \
            --verify-tag

  deploy-dev:
    needs: [determine-version, build, helm-package-push, release]
    runs-on: ubuntu-24.04
    environment:
      name: dev
    permissions:
      contents: write  # Allow write version in ArgoCD dev repo
    steps:
      - name: Get GitHub App token
        id: gh-app-auth
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: 'Constantin07'
          repositories: argocd-dev
          permission-contents: write

      - name: Checkout ArgoCD env repo
        uses: actions/checkout@v7
        with:
          repository: Constantin07/argocd-dev
          token: ${{ steps.gh-app-auth.outputs.token }}

      - name: Get version
        env:
          VERSION: "${{ needs.determine-version.outputs.next_version }}"
        run: |
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "$VERSION"

      - name: Update Helm dependency version
        run: |
          yq -i '(.dependencies[] | select(.name == "hello-kubernetes").version) = strenv(VERSION)' simple-k8s-app/Chart.yaml

      - name: Show change
        run: git diff -- simple-k8s-app/Chart.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add simple-k8s-app/Chart.yaml
          git diff --cached --quiet || git commit -m "chore: Bump simple-k8s-app to ${{ env.VERSION }}"
          git pull --rebase --autostash origin main
          git push
