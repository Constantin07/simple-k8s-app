{{- if .Values.ingress.enabled }}
{{- $previewHost := regexReplaceAll "^(.+)\\.(.+)$" .Values.ingress.host "$1-preview.$2" }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hello-kubernetes.fullname" . }}
  labels: {{- include "hello-kubernetes.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName | quote }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
        {{- if and .Values.rollouts.enabled .Values.rollouts.strategy.blueGreen }}
        - {{ $previewHost | quote }}
        {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "hello-kubernetes.serviceName" . }}
                port:
                  number: {{ .Values.container.port }}
    {{- if and .Values.rollouts.enabled .Values.rollouts.strategy.blueGreen }}
    - host: {{ $previewHost | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "hello-kubernetes.previewServiceName" . }}
                port:
                  number: {{ .Values.container.port }}
     {{- end }}
{{- end }}
