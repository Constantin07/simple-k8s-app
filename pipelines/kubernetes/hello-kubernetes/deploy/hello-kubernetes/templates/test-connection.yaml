{{- if .Values.connectivityTest.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hello-kubernetes.fullname" . }}-test-connection
  labels: {{- include "hello-kubernetes.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    {{/* argocd.argoproj.io/hook-delete-policy: HookSucceeded */}}
spec:
  # Automatically remove the job object from K8s 5 minutes after it finishes
  ttlSecondsAfterFinished: 300
  # Try the test up to 3 times before declaring a definitive failure
  backoffLimit: 3
  completions: 1
  activeDeadlineSeconds: 30
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hello-kubernetes.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: wget
          image: busybox
          command:
            - 'wget'
          args:
            {{- if and .Values.rollouts.enabled (hasKey .Values.rollouts "strategy") (hasKey .Values.rollouts.strategy "blueGreen") }}
            - "http://{{ include "hello-kubernetes.previewServiceName" . }}:{{ .Values.service.port }}"
            {{- else }}
            - "http://{{ include "hello-kubernetes.serviceName" . }}:{{ .Values.service.port }}"
            {{- end }}
      restartPolicy: Never
{{- end }}
