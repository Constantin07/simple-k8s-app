{{- if and .Values.rollouts.enabled (eq .Values.rollouts.strategy "canary") }}
{{- $serviceName := include "hello-kubernetes.canaryServiceName" . -}}
---
{{- include "hello-kubernetes.service" (dict
  "serviceName" $serviceName
  "Values" .Values
  "Release" .Release
  "Chart" .Chart)
-}}
{{- end }}
