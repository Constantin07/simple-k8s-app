suite: Test Ingress

templates:
  - templates/ingress.yaml

release:
  name: test-release
  namespace: default

tests:
  - it: should create ingress when enabled
    set:
      ingress.enabled: true

    asserts:
      - isKind:
          of: Ingress

  - it: should not create ingress when disabled
    set:
      ingress.enabled: false

    asserts:
      - hasDocuments:
          count: 0

  - it: should use the configured ingress class
    set:
      ingress.enabled: true
      ingress.ingressClassName: nginx

    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx

  - it: should configure the host
    set:
      ingress.enabled: true
      ingress.host: hello.example.com

    asserts:
      - equal:
          path: spec.rules[0].host
          value: hello.example.com

  - it: should configure the service backend
    set:
      ingress.enabled: true
      ingress.host: hello.example.com

    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: test-release-hello-kubernetes

  - it: should configure the backend port
    set:
      ingress.enabled: true
      container.port: 80

    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 80
