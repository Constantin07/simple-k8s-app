suite: Test service preview

templates:
  - templates/service-preview.yaml

release:
  name: test-release

tests:
  - it: should pass
    set:
      rollouts.enabled: true
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - contains:
          path: spec.ports
          content:
            port: 8080
            targetPort: 8080
            protocol: TCP
      - matchRegex:
          path: spec.selector["app.kubernetes.io/name"]
          pattern: hello-kubernetes

  - it: should contain document
    set:
      rollouts.enabled: true
    release:
      name: test-release
    asserts:
      - containsDocument:
          kind: Service
          apiVersion: v1
        documentIndex: 0
