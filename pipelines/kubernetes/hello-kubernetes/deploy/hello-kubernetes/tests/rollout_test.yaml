suite: Test Rollout

templates:
  - templates/rollout.yaml

release:
  name: test-release
  namespace: default

tests:
  - it: should provide expected defaults for blueGreen
    set:
      deployment.enabled: false
      rollouts:
        enabled: true
        strategy: blueGreen
        blueGreen:
          autoPromotionEnabled: true
    asserts:
      - isKind:
          of: Rollout
      - hasDocuments:
          count: 1
      - notEqual:
          path: spec.replicas
          value: 0
      - notExists:
          path: spec.strategy.canary
      - equal:
          path: spec.strategy.blueGreen.activeService
          value: test-release-hello-kubernetes
      - equal:
          path: spec.strategy.blueGreen.previewService
          value: test-release-hello-kubernetes-preview
      - exists:
          path: spec.strategy.blueGreen

  - it: should provide expected defaults for canary
    set:
      deployment:
        enabled: false
      rollouts:
        enabled: true
        strategy: canary
        canary:
          maxUnavailable: 0
          steps:
            - setWeight: 20
            - pause:
                duration: 15
            - analysis: {}
    asserts:
      - isKind:
          of: Rollout
      - hasDocuments:
          count: 1
      - notEqual:
          path: spec.replicas
          value: 0
      - notExists:
          path: spec.strategy.blueGreen
      - equal:
          path: spec.strategy.canary.stableService
          value: test-release-hello-kubernetes
      - equal:
          path: spec.strategy.canary.canaryService
          value: test-release-hello-kubernetes-canary
      - exists:
          path: spec.strategy.canary
      - exists:
          path: spec.strategy.canary.steps[0]
