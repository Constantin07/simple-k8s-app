{{- if .Values.rollouts.enabled -}}
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "hello-kubernetes.fullname" . }}
  labels: {{- include "hello-kubernetes.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/change-cause: {{ .Values.image.tag | quote }}
    checkov.io/skip1: CKV_K8S_9=There is no need for readiness probes for some containers.
    checkov.io/skip2: CKV_K8S_10=CPU requests are passed via include
    checkov.io/skip3: CKV_K8S_11=CPU limits are passed via include
    checkov.io/skip4: CKV_K8S_12=Memory requests are passed via include
    checkov.io/skip5: CKV_K8S_13=Memory limits are passed via include
    checkov.io/skip6: CKV_K8S_22=Cannot use Read-Only filesystem on all containers at the moment.
    checkov.io/skip7: CKV_K8S_25=IPC_LOCK capability is required by vault.
    checkov.io/skip8: CKV_K8S_38=Mounting service account is required for authentication.
spec:
  replicas: {{ .Values.replicaCount }}
  analysis:
   successfulRunHistoryLimit: 3
   unsuccessfulRunHistoryLimit: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hello-kubernetes.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- $blueGreen := hasKey .Values.rollouts.strategy "blueGreen" }}
{{- $canary := hasKey .Values.rollouts.strategy "canary" }}
{{- if and $blueGreen $canary }}
{{- fail "rollouts.strategy cannot contain both blueGreen and canary" }}
{{- end }}
  strategy:
    {{- if $blueGreen }}
    blueGreen:
      activeService: {{ include "hello-kubernetes.serviceName" . }}
      previewService: {{ include "hello-kubernetes.previewServiceName" . }}
      {{- toYaml .Values.rollouts.strategy.blueGreen | nindent 6 }}
      {{- if and (hasKey .Values.rollouts.strategy.connectivityTest "enabled") .Values.rollouts.strategy.connectivityTest.enabled }}
      prePromotionAnalysis:
        templates:
          - templateName: {{ include "hello-kubernetes.fullname" . }}-preview-test
      {{- end }}
  {{- else if $canary }}
    canary:
      stableService: {{ include "hello-kubernetes.serviceName" . }}
      canaryService: {{ include "hello-kubernetes.fullname" . }}-canary
      {{- toYaml .Values.rollouts.strategy.canary | nindent 6 }}
  {{- else }}
  {{- fail "rollouts.strategy must contain either 'blueGreen' or 'canary'" }}
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hello-kubernetes.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        {{- if .Values.vaultAgent.enabled }}
        checksum/vault-agent-config: {{ include (print $.Template.BasePath "/vault-agent-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.consulTemplate.enabled }}
        checksum/consul-template-config: {{ include (print $.Template.BasePath "/consul-template-configmap.yaml") . | sha256sum }}
        {{- end }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: "app.kubernetes.io/name"
                      operator: In
                      values:
                        - {{ include "hello-kubernetes.name" . }}
                topologyKey: "kubernetes.io/hostname"
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "hello-kubernetes.name" . }}
      serviceAccountName: {{ include "hello-kubernetes.fullname" . }}
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      {{- if .Values.consulTemplate.enabled }}
      initContainers:
        {{- include "hello-kubernetes.consul-init" . | nindent 8 }}
      {{- end }}

      containers:
        {{- include "hello-kubernetes.application" . | nindent 8 }}
        {{- if .Values.vaultAgent.enabled }}
          {{- include "hello-kubernetes.vault-agent" . | nindent 8 }}
        {{- end }}
        {{- if .Values.consulTemplate.enabled }}
          {{- include "hello-kubernetes.consul-template" . | nindent 8 }}
        {{- end }}
        {{- if .Values.proxy.enabled }}
          {{- include "hello-kubernetes.proxy" . | nindent 8 }}
        {{- end }}
      volumes:
        - name: secrets
          emptyDir:
            medium: "Memory"
        {{- if .Values.vaultAgent.enabled }}
        - name: vault-config
          configMap:
            name: {{ include "hello-kubernetes.fullname" . }}-vault-agent-config
        {{- end }}
        {{- if .Values.consulTemplate.enabled }}
        - name: consul-template-config
          configMap:
            name: {{ include "hello-kubernetes.fullname" . }}-consul-template-config
        {{- end }}
        {{- if .Values.proxy.enabled }}
        - name: proxy-config
          configMap:
            name: {{ include "hello-kubernetes.fullname" . }}-proxy-config
        {{- end }}
{{- end }}
