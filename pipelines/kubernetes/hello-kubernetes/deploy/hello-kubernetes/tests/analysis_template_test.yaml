suite: Test AnalysisRollout

templates:
  - templates/analysis-template-test.yaml

release:
  name: test-release
  namespace: default

set:
  rollouts.enabled: true
  rollouts:.strategy: blueGreen
  service.port: 8080

tests:
  - it: should render AnalysisTemplate when connectivity test is enabled
    set:
      rollouts.connectivityTest.enabled: true
    asserts:
      - isKind:
          of: AnalysisTemplate

  - it: should use preview service when connectivity URL is not configured
    set:
      rollouts.connectivityTest.enabled: true
    asserts:
      - matchRegex:
          path: spec.metrics[0].provider.job.spec.template.spec.containers[0].command[2]
          pattern: 'http://.*:8080'

  - it: should not render AnalysisTemplate when connectivity test is disabled
    set:
      rollouts.connectivityTest.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render AnalysisTemplate when rollouts are disabled
    set:
      rollouts.enabled: false
      rollouts.connectivityTest.enabled: true
    asserts:
      - hasDocuments:
          count: 0
