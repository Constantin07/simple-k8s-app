---
# Default values for hello-kubernetes application

# -- Number of pods to deploy
replicaCount: 1

image:
  repository: constantin07/hello-kubernetes
  tag: 0.0.1
  pullPolicy: Always

container:
  port: 8080

env: {}

# -- Whether to enable K8s deployment
deployment:
  enabled: true
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# -- Whether to enable Argo Rollouts
rollouts:
  enabled: false
  paused: false
  strategy: blueGreen
  blueGreen:
    autoPromotionEnabled: true
    autoPromotionSeconds: 45
    scaleDownDelaySeconds: 30
    previewReplicaCount: 1

  canary:
    maxUnavailable: 0
    maxSurge: 25%
  #  steps:
  #    - setWeight: 20
  #    - pause:
  #        duration: 60s
  #    - setWeight: 50

  connectivityTest:
    enabled: false
    url: "http://localhost:8080"

resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    memory: 128Mi

securityContext:
  allowPrivilegeEscalation: false
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

vaultAgent:
  enabled: false
  image:
    repository: constantin07/vault-agent
    tag: 1.16.2
    pullPolicy: Always
  role: ""
  env: {}
  resources:
    requests:
      cpu: 20m
      memory: 20Mi
    limits:
      cpu: 70m
      memory: 32Mi

consulTemplate:
  enabled: false
  image:
    repository: constantin07/consul-template
    tag: 0.37.6
    pullPolicy: Always
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 60m
      memory: 96Mi

proxy:
  enabled: false
  image:
    repository: constantin07/docker-nginx-proxy
    tag: 0.0.1
    pullPolicy: Always
  port: 8443
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

service:
  type: ClusterIP
  protocol: TCP
  port: 8080

ingress:
  enabled: false
  annotations: {}
  host: chart-example.local
  path: /

# -- Whether to enable Gateway API HTTPRoute
httpRoute:
  enabled: false
  parentRefs:
    - name: kong
      namespace: kong
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

hpa:
  enabled: false
  maxReplicas: 4
